name: Bug report
description: Report a reproducible integration problem without sensitive router data.
body:
  - type: markdown
    attributes:
      value: |
        This integration is experimental; no router model is hardware-verified.
        Do not include credentials, router addresses, serial numbers, IMEI/ICCID,
        location, authorization headers, raw responses, or backups.
        Report security issues privately, not with this form.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version or commit
    validations:
      required: true
  - type: input
    id: router-model
    attributes:
      label: Router model and NCOS version
      description: Include model/firmware only, not unique router identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps, expected behavior, and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized error text or integration diagnostics
      description: Review attachments for sensitive information before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and identifying router/network information.
          required: true
