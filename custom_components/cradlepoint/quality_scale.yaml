rules:
  action-setup:
    status: exempt
    comment: This initial read-only integration registers no service actions.
  appropriate-polling:
    status: done
    comment: custom_components/cradlepoint/const.py sets a 60-second interval; tests/test_init.py and tests/test_gps.py verify shared router polling and independent GPS scheduling without claiming hardware verification.
  brands:
    status: todo
    comment: Submit and verify the integration assets in the Home Assistant brands repository.
  common-modules:
    status: done
    comment: custom_components/cradlepoint/const.py holds shared constants and custom_components/cradlepoint/coordinator.py centralizes updates exercised by tests/test_init.py.
  config-flow:
    status: done
    comment: custom_components/cradlepoint/config_flow.py implements validated UI configuration; tests/test_config_flow.py exercises successful and rejected input.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py and tests/test_optional.py exercise connection and GPS options branches in custom_components/cradlepoint/config_flow.py; pyproject.toml defines the unchanged coverage gate.
  dependency-transparency:
    status: done
    comment: custom_components/cradlepoint/manifest.json declares no extra requirements; custom_components/cradlepoint/api.py uses the Home Assistant supplied aiohttp client and docs/security.md explains the API contract.
  docs-actions:
    status: exempt
    comment: This initial read-only integration exposes no service actions to document.
  docs-conditions:
    status: exempt
    comment: This integration provides no custom automation conditions.
  docs-high-level-description:
    status: done
    comment: README.md describes the read-only router integration and its scope; quality_scale.md explains this self-assessment.
  docs-installation-instructions:
    status: done
    comment: docs/setup.md explains installation and initial configuration.
  docs-removal-instructions:
    status: done
    comment: docs/setup.md describes removing the integration and its configuration entry.
  docs-triggers:
    status: exempt
    comment: This integration provides no custom automation triggers.
  entity-event-setup:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py use CoordinatorEntity lifecycle subscriptions; tests/test_init.py, tests/test_gps.py and tests/test_device_tracker.py verify polling and GPS freshness callbacks stop after unloading.
  entity-unique-id:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py define serial-based entity identifiers; tests/test_init.py and tests/test_device_tracker.py verify registry identity including tracker reloads.
  has-entity-name:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py enable has_entity_name; custom_components/cradlepoint/strings.json defines their translations.
  runtime-data:
    status: done
    comment: custom_components/cradlepoint/coordinator.py defines typed entries and custom_components/cradlepoint/__init__.py assigns runtime_data exercised by tests/test_init.py.
  test-before-configure:
    status: done
    comment: custom_components/cradlepoint/config_flow.py reads product identity before entry creation; tests/test_config_flow.py verifies success and distinct failure handling.
  test-before-setup:
    status: done
    comment: custom_components/cradlepoint/__init__.py awaits first refresh before forwarding platforms; tests/test_init.py checks failed setup creates no entities.
  unique-config-entry:
    status: done
    comment: custom_components/cradlepoint/config_flow.py checks serial-based unique IDs; tests/test_config_flow.py verifies duplicates are rejected even at a changed origin.
  action-exceptions:
    status: exempt
    comment: This initial read-only integration has no service actions that raise exceptions.
  config-entry-unloading:
    status: done
    comment: custom_components/cradlepoint/__init__.py unloads platforms; tests/test_init.py verifies listener cleanup and propagates unload failure.
  docs-configuration-parameters:
    status: done
    comment: docs/setup.md explains configuration parameters and their usage.
  docs-installation-parameters:
    status: done
    comment: docs/setup.md documents required router credentials and installation parameters.
  entity-unavailable:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py inherit per-stream coordinator availability; tests/test_init.py, tests/test_gps.py and tests/test_device_tracker.py verify failures, wrong-router rejection, GPS freshness expiry and recovery.
  integration-owner:
    status: done
    comment: custom_components/cradlepoint/manifest.json declares the integration codeowner and CONTRIBUTING.md documents maintainer reporting responsibilities.
  log-when-unavailable:
    status: todo
    comment: Verify coordinator transition logging avoids repeated failure messages.
  parallel-updates:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py explicitly declare PARALLEL_UPDATES = 0 because custom_components/cradlepoint/coordinator.py handles shared polling.
  reauthentication-flow:
    status: done
    comment: custom_components/cradlepoint/config_flow.py implements same-router reauthentication; tests/test_config_flow.py and tests/test_init.py verify updates and authentication failures.
  test-coverage:
    status: done
    comment: tests/test_api.py, tests/test_config_flow.py, tests/test_init.py, tests/test_optional.py, tests/test_telemetry.py, tests/test_gps.py, tests/test_device_tracker.py and tests/test_input_bounds.py exercise transport, lifecycle, independent GPS, opted-in tracking, consent and malformed-input regressions; pyproject.toml retains at least 96 percent integration coverage and CI enforces 100 percent config-flow coverage.
  devices:
    status: done
    comment: custom_components/cradlepoint/sensor.py defines router device metadata; tests/test_init.py verifies stable identifiers, manufacturer, model, and serial; tests/test_device_tracker.py confirms the opted-in tracker joins that same device.
  diagnostics:
    status: done
    comment: custom_components/cradlepoint/diagnostics.py allowlists product name and update success; tests/test_init.py confirms addresses, credentials, serials, and raw responses are excluded.
  discovery:
    status: done
    comment: custom_components/cradlepoint/manifest.json matches known CradlePoint DHCP MAC prefixes; custom_components/cradlepoint/config_flow.py prompts for credentials and validates serial identity, covered by tests/test_config_flow.py.
  discovery-update-info:
    status: todo
    comment: Discovery-driven connection updates are not implemented in this initial release.
  docs-data-update:
    status: done
    comment: docs/features.md documents polling and the local data update behavior.
  docs-examples:
    status: done
    comment: docs/features.md gives practical examples using the provided router sensors.
  docs-known-limitations:
    status: done
    comment: docs/features.md and docs/security.md explain supported scope and limitations.
  docs-supported-devices:
    status: done
    comment: docs/features.md describes router compatibility and verification limits.
  docs-supported-functions:
    status: done
    comment: docs/features.md lists supported read-only router functions.
  docs-troubleshooting:
    status: done
    comment: docs/troubleshooting.md explains connection and authentication troubleshooting; CONTRIBUTING.md explains reporting reproducible issues.
  docs-use-cases:
    status: done
    comment: docs/features.md describes practical monitoring use cases.
  dynamic-devices:
    status: todo
    comment: Verify device lifecycle behavior and assess dynamic device requirements.
  entity-category:
    status: done
    comment: custom_components/cradlepoint/sensor.py assigns the diagnostic category and tests/test_init.py verifies the entity registry category.
  entity-device-class:
    status: todo
    comment: Verify device classes are assigned where semantically appropriate.
  entity-disabled-by-default:
    status: todo
    comment: Verify less-useful diagnostic entities have appropriate default enablement.
  entity-translations:
    status: done
    comment: custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py use translated product, firmware, WAN and opted-in GPS descriptions in custom_components/cradlepoint/strings.json and custom_components/cradlepoint/translations/en.json; tests/test_optional.py and tests/test_device_tracker.py exercise their real HA entities.
  exception-translations:
    status: todo
    comment: Verify user-facing exceptions use supported translated error keys.
  icon-translations:
    status: done
    comment: custom_components/cradlepoint/icons.json defines translated sensor and gps_location tracker icons matching custom_components/cradlepoint/sensor.py and custom_components/cradlepoint/device_tracker.py.
  reconfiguration-flow:
    status: done
    comment: custom_components/cradlepoint/config_flow.py implements same-router reconfiguration; tests/test_config_flow.py verifies changed connection details and wrong-router rejection.
  repair-issues:
    status: todo
    comment: Repair issue creation and resolution are not implemented in this initial release.
  stale-devices:
    status: todo
    comment: Verify stale device handling and assess registry removal behavior.
  async-dependency:
    status: done
    comment: custom_components/cradlepoint/api.py uses asynchronous aiohttp requests and timeouts; tests/test_api.py exercises response, authentication, TLS, and timeout handling.
  inject-websession:
    status: done
    comment: custom_components/cradlepoint/__init__.py and custom_components/cradlepoint/config_flow.py inject the Home Assistant session into custom_components/cradlepoint/api.py without taking session ownership.
  strict-typing:
    status: done
    comment: Strict mypy checks pass under pyproject.toml; custom_components/cradlepoint/coordinator.py defines typed entry runtime data and custom_components/cradlepoint/telemetry.py defines immutable normalized WAN/GPS snapshots.
