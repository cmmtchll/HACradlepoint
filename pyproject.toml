[project]
name = "hacradlepoint"
version = "0.1.0"
description = "Read-only CradlePoint router integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant==2026.10.2",
    "pytest-homeassistant-custom-component==0.13.373",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "PyYAML==6.0.3",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.cradlepoint" = [
    "*.json",
    "*.yaml",
    "translations/*.json",
    "brand/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=custom_components.cradlepoint",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=96",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D"]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/cradlepoint", "scripts"]
